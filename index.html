
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Nature Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Beautiful Nature Gallery</h1>
        <p>Explore the beauty of our natural world.</p>
    </header>

    <main id="main-content">
        <section class="gallery" aria-label="Nature photo gallery">

            <figure>
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80"
                     alt="A peaceful lake surrounded by green mountains">
                <figcaption>
                    <h2>Mountain Lake</h2>
                    <p>A peaceful lake reflects the mountains and the beautiful sky.</p>
                </figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80"
                     alt="Sunlight shining through a green forest">
                <figcaption>
                    <h2>Green Forest</h2>
                    <p>Tall trees create a quiet place for plants and animals.</p>
                </figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80"
                     alt="A wide natural landscape under a bright sky">
                <figcaption>
                    <h2>Open Landscape</h2>
                    <p>Wide open spaces offer beautiful views of nature.</p>
                </figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef2852e6b?auto=format&fit=crop&w=900&q=80"
                     alt="A lake with mountains in the background">
                <figcaption>
                    <h2>Quiet Waters</h2>
                    <p>Calm water and distant mountains create a relaxing view.</p>
                </figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80"
                     alt="High mountain peaks rising above the clouds">
                <figcaption>
                    <h2>High Mountains</h2>
                    <p>Mountain peaks show the power and beauty of the natural world.</p>
                </figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=900&q=80"
                     alt="Wild deer standing in a natural green environment">
                <figcaption>
                    <h2>Wildlife</h2>
                    <p>Wild animals are an important part of a healthy ecosystem.</p>
                </figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>Protect nature and keep our planet beautiful.</p>
        <a href="#main-content">Return to Top</a>
    </footer>

</body>
</html>
